name: Test and publish PlanetStream
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/**'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources and simulation
        run: |
          find src -name '*.js' -exec node --check {} \;
          for test in tests/*.cjs; do node "$test"; done
      - name: Build and test both standalone profiles
        run: |
          python tools/build.py
          python -m pip install playwright -r tools/requirements-region.txt
          python -m playwright install --with-deps chromium
          python tests/test_planetstream.py
          python tests/test_region_import.py
          python tests/test_planet_stress.py
          for archive in dist/*.zip; do unzip -tq "$archive"; done
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'from tools.build import VERSION; print(VERSION)')
          tag="v${version}.0"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "TrussLab Architect $version — PlanetStream" --notes-file docs/PLANETSTREAM_RU.md
          fi
