name: Build and publish TrussLab 14.0

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/build.py'
      - 'tests/test_worldeditor_core.cjs'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'OldFikus/TrussLab-Architect'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: |
          for file in src/game.js src/rendercore/*.js src/worldeditor*.js; do node --check "$file"; done
      - name: WorldEditor regression tests
        run: |
          node tests/test_worldeditor_core.cjs
          node tests/test_wgs84_alignment.cjs
      - name: Build release assets
        run: python tools/build.py
      - name: Validate HTML and ZIPs
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('dist')
          html=root/'TrussLab_Architect_14_0.html'
          data=html.read_text(encoding='utf8')
          assert len(data)>1_800_000
          assert '<title>TrussLab Architect 14.0 — WorldEditor 2</title>' in data
          for k in ('TrussLabWorldEditorCore','worldeditor-open','we-root','region3d-open','earthworks-toggle'):
              assert k in data,k
          for name in ('TrussLab_Architect_14_0_Portable.zip','TrussLab_Architect_14_0_Source.zip'):
              with ZipFile(root/name) as z: assert z.testzip() is None
          print('WorldEditor 14.0 artifacts verified')
          PY
      - name: Publish GitHub Release v14.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v14.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v14.0.0 exists. Refusing to overwrite its immutable files.'
          else
            gh release create v14.0.0 \
              dist/TrussLab_Architect_14_0.html \
              dist/TrussLab_Architect_14_0_Portable.zip \
              dist/TrussLab_Architect_14_0_Source.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'TrussLab Architect 14.0 — WorldEditor 2' \
              --notes-file docs/RELEASE_14_RU.md \
              --latest
          fi
