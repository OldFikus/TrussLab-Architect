name: Test and publish TrussLab
on:
  push:
    branches: [main, 'release/planetstream-*', 'release/candidate-*']
    paths: ['src/**', 'tests/**', 'tools/**', 'examples/**', '.github/workflows/publish-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compatibility:
    if: contains(github.event.head_commit.message, '[matrix]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: ubuntu-latest, engine: firefox}
          - {os: macos-15, engine: webkit}
          - {os: windows-latest, engine: chromium}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/build.py
        env: {PYTHONUTF8: '1'}
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/test_compatibility.py ${{ matrix.engine }}
        env: {PYTHONUTF8: '1'}
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.os }}-${{ matrix.engine }}
          path: compat-*.json
  release:
    needs: compatibility
    if: always() && (needs.compatibility.result == 'success' || needs.compatibility.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate sources and simulation
        run: |
          while IFS= read -r -d '' source; do node --check "$source"; done < <(find src -name '*.js' -print0)
          for test in tests/*.cjs; do node "$test"; done
      - name: Build and test both standalone profiles
        run: |
          python tools/build.py
          python -m pip install playwright pillow -r tools/requirements-region.txt
          python -m playwright install --with-deps chromium
          python tests/test_planetstream.py
          python tests/test_region_import.py
          for test in tests/test_heritage.py tests/test_planet_stress.py tests/test_release_candidate.py tests/test_coastal_layers.py tests/test_worldforge_package.py tests/test_worldeditor_e2e.py tests/test_lab_materials.py tests/test_assetstream.py tests/test_visual_reflection_regression.py tests/test_renderer_fallback.py; do
            if test -f "$test"; then python "$test"; fi
          done
          python tests/test_compatibility.py chromium --webgpu-software
          mv compat-WebGPU-SwiftShader.json dist/
          for archive in dist/*.zip; do unzip -tq "$archive"; done
      - uses: actions/download-artifact@v4
        if: needs.compatibility.result == 'success'
        with:
          pattern: compat-*
          path: dist
          merge-multiple: true
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'from tools.build import VERSION; print(VERSION)')
          series=$(python -c 'from tools import build; print(getattr(build, "SERIES", "PlanetStream"))')
          tag="v${version}.0"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "TrussLab Architect $version — $series" --notes-file "docs/${series^^}_RU.md"
          fi
