name: TrussLab 13 source smoke
on:
  push:
    paths:
      - 'src/offline13/**'
      - '.github/workflows/trusslab13.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JavaScript syntax
        run: node --check src/offline13/game.js
      - name: Rebuild standalone HTML from sources
        run: python src/offline13/build.py
      - name: Validate release contents
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/TrussLab_Architect_13_0.html")
          s=p.read_text(encoding="utf-8")
          assert p.stat().st_size>1000000
          for token in ("frame-policy","traffic-rate","light-preset","mobile-freecam","World3D","TrussLab Architect 13.0"):
              assert token in s, token
          print("13.0 source build verified",p.stat().st_size)
          PY
